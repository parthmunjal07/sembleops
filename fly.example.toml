# Example Fly.io configuration. Copy this file to fly.toml, then choose your
# own application name and region with `fly launch` before deploying.

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 4747
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
